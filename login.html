
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page description -->
    <meta
        name="description"
        content="Log in to your TRP account and continue your learning journey."
    >

    <!-- Browser title -->
    <title>Login | TRP</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="signup-page">

    <!-- Login Container -->
    <main class="signup-container">

        <!-- Heading -->
        <h1>Welcome Back!</h1>

        <p>Log in to your TRP account to continue.</p>

        <!-- Login Form -->
        <form id="login-form">

            <!-- Email -->
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

            <!-- Password -->
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <!-- Login Button -->
            <button type="submit" id="login-btn">
                Log In
            </button>

            <!-- Login Feedback -->
            <p
                id="login-message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <!-- Signup Link -->
        <p>
            Don't have an account?
            <a href="signup.html">Create an account</a>
        </p>

        <!-- Home Link -->
        <p>
            <a href="index.html">Back to Home</a>
        </p>

    </main>

    <!-- Login JavaScript -->
    <script type="module" src="login.js"></script>

</body>

</html>
