<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <main class="home">
    <h1>Welcome to My app</h1>
    <p>Test your knowledge and improve your skills.</p>
    <h2>Select Subject</h2>
    <button class="subject-btn" data-subject="mathematics">Mathematics</button>
    <button class="subject-btn" data-subject="programming">Programming</button>
    <button class="subject-btn"
     data-subject="science">Science</button>
     <div id="science-option">
        <h3>Select Science Subject</h3>
        <button class="subject-btn"
        data-subject="physics">Physics</button>
         <button class="subject-btn"
        data-subject="chemistry">Chemistry</button>
         <button class="subject-btn"
        data-subject="biology">Biology</button>
     </div>
    <button id="start-btn">Start Quiz</button>
    </main> 
    <section id="quiz" class="quiz">
        <h2>Quiz</h2>
        <p id="question">Question will appear here</p>
        <button class="option">Option A</button>
        <button class="option">Option B</button>
         <button class="option">Option C</button>
          <button class="option">Option D</button>
          <button id="next-btn">Next</button>
    </section>
    <script src="script.js"></script>
</body>
</html>
